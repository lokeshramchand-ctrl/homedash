# Dashboard (embedded SQLite).   cp server/.env.example .env   then   docker compose up -d --build
# Create the first user:  docker compose run --rm app node build/create-user.js <name>
services:
  app:
    build: .
    image: homedash:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal wiring; these override whatever is in .env.
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/homedash.db
      SERVE_DIST: /app/dist
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - data:/data
      # Read-only: the backend never writes to nginx.
      - ${NGINX_SITES_HOST_DIR:-./nginx-sites}:/etc/nginx/sites-enabled:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  data:

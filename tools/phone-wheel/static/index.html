<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Phone Wheel</title>
<style>
  :root { --bg:#111; --panel:#1d1f24; --line:#2e323a; --fg:#eceff4; --dim:#8b93a1; --acc:#3ea6ff; --gas:#2ecc71; --brk:#e5484d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
  html, body { margin:0; height:100%; height:100dvh; background:var(--bg); color:var(--fg); font:600 14px system-ui, sans-serif; overflow:hidden; overscroll-behavior:none; }
  #app { display:grid; grid-template-columns: 1fr 1.8fr 1fr; grid-template-rows:minmax(0,1fr); height:100dvh; gap:10px; height:100%; padding:10px max(10px, env(safe-area-inset-right)) 10px max(10px, env(safe-area-inset-left)); }
  .pedal { border-radius:18px; background:var(--panel); border:2px solid var(--line); position:relative; overflow:hidden; display:flex; align-items:flex-end; justify-content:center; }
  .pedal .fill { position:absolute; left:0; right:0; bottom:0; height:0; opacity:.85; }
  #brake .fill { background:var(--brk); } #gas .fill { background:var(--gas); }
  .pedal span { position:relative; padding-bottom:14px; font-size:18px; letter-spacing:.1em; text-shadow:0 1px 3px #000; }
  #mid { display:flex; flex-direction:column; gap:10px; min-width:0; }
  #gauge { flex:1; position:relative; background:var(--panel); border:2px solid var(--line); border-radius:18px; display:flex; align-items:center; justify-content:center; min-height:0; }
  #wheel { height:88%; aspect-ratio:1; max-width:90%; }
  #state { position:absolute; top:8px; left:12px; color:var(--dim); font-size:12px; }
  #state.ok { color:var(--gas); } #state.bad { color:var(--brk); }
  #deg { position:absolute; top:8px; right:12px; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  #btns { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .b { padding:8px 2px; font-size:12px; white-space:nowrap; text-align:center; border-radius:12px; background:var(--panel); border:2px solid var(--line); }
  .b.on { background:var(--acc); border-color:var(--acc); color:#000; }
  #bar { display:flex; gap:8px; }
  #bar .b { flex:1; padding:6px 4px; font-size:11px; color:var(--dim); }
  #settings { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:5; }
  #settings.open { display:flex; }
  #sbox { background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:16px 20px; width:min(520px, 92vw); max-height:94vh; overflow:auto; touch-action:pan-y; }
  #sbox * { touch-action:auto; }
  #sbox label { display:flex; align-items:center; gap:12px; margin:10px 0; }
  #sbox label span:first-child { width:130px; color:var(--dim); }
  #sbox input[type=range] { flex:1; }
  #sbox button { width:100%; margin-top:8px; padding:12px; border-radius:12px; border:0; font:inherit; background:var(--acc); color:#000; }
  #sbox button.alt { background:var(--line); color:var(--fg); }
  #rotate { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:9; font-size:18px; text-align:center; padding:30px; }
  @media (orientation:portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="app">
  <div class="pedal" id="brake"><div class="fill"></div><span>BRAKE</span></div>
  <div id="mid">
    <div id="gauge">
      <div id="state">connecting…</div><div id="deg">0°</div>
      <svg id="wheel" viewBox="-100 -100 200 200">
        <g id="wheelg">
          <circle r="86" fill="none" stroke="#8b93a1" stroke-width="12"/>
          <circle r="14" fill="#8b93a1"/>
          <line x1="-80" y1="0" x2="-14" y2="0" stroke="#8b93a1" stroke-width="10"/>
          <line x1="80" y1="0" x2="14" y2="0" stroke="#8b93a1" stroke-width="10"/>
          <line x1="0" y1="14" x2="0" y2="80" stroke="#8b93a1" stroke-width="10"/>
          <path d="M-12 -86 L12 -86" stroke="#3ea6ff" stroke-width="12"/>
        </g>
      </svg>
    </div>
    <div id="btns"></div>
    <div id="bar"><div class="b" id="bCal">Centre</div><div class="b" id="bFs">Fullscreen</div><div class="b" id="bSet">Settings</div></div>
  </div>
  <div class="pedal" id="gas"><div class="fill"></div><span>GAS</span></div>
</div>

<div id="settings"><div id="sbox">
  <label><span>Full lock angle</span><input id="sRange" type="range" min="20" max="120" step="5"><span id="vRange"></span></label>
  <label><span>Dead zone</span><input id="sDead" type="range" min="0" max="10" step="0.5"><span id="vDead"></span></label>
  <label><span>Smoothing</span><input id="sSmooth" type="range" min="0" max="90" step="5"><span id="vSmooth"></span></label>
  <label><span>Invert steering</span><input id="sInv" type="checkbox"></label>
  <label><span>Pedal position</span><input id="sAnalog" type="checkbox"><span>Analog (touch height = amount)</span></label>
  <button id="bCal2">Set current tilt as centre</button>
  <button class="alt" id="bClose">Close</button>
</div></div>

<div id="rotate">Turn your phone sideways and hold it like a steering wheel.</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const defaults = { range: 60, dead: 2, smooth: 30, inv: false, analog: true, centre: 0 };
let cfg = { ...defaults };
try { cfg = { ...defaults, ...JSON.parse(localStorage.getItem("wheelcfg") || "{}") }; } catch {}
const save = () => { try { localStorage.setItem("wheelcfg", JSON.stringify(cfg)); } catch {} };

// ---- buttons (names are what the PC maps to Xbox buttons) ----
const BTNS = [
  ["lb", "◀ Indicator"], ["rb", "Indicator ▶"], ["y", "Horn"], ["x", "Lights"],
  ["a", "Engine"], ["b", "Park brake"], ["up", "Gear +"], ["down", "Gear −"],
];
const held = new Set();
const btnsEl = $("btns");
for (const [id, label] of BTNS) {
  const el = document.createElement("div");
  el.className = "b"; el.textContent = label;
  const on = (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); held.add(id); el.classList.add("on"); buzz(); };
  const off = () => { held.delete(id); el.classList.remove("on"); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off); el.addEventListener("pointercancel", off);
  btnsEl.appendChild(el);
}
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch {} }

// ---- pedals ----
const pedal = { brake: 0, gas: 0 };
for (const id of ["brake", "gas"]) {
  const el = $(id), fill = el.querySelector(".fill");
  const set = (v) => { pedal[id] = v; fill.style.height = (v * 100) + "%"; };
  const fromEvent = (e) => {
    if (!cfg.analog) return 1;
    const r = el.getBoundingClientRect();
    return Math.min(1, Math.max(0.05, (r.bottom - e.clientY) / r.height));
  };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); set(fromEvent(e)); });
  el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) set(fromEvent(e)); });
  const up = () => set(0);
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}

// ---- tilt -> steering ----
// In landscape the phone's long (x) axis is "up". Tilting the wheel puts gravity on the y axis.
let rawRoll = 0, haveSensor = false, steer = 0;
window.addEventListener("devicemotion", (e) => {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null || g.y == null) return;
  haveSensor = true;
  const sgn = g.x >= 0 ? 1 : -1;                         // landscape either way round
  rawRoll = Math.atan2(g.y * sgn, Math.abs(g.x)) * 180 / Math.PI;  // degrees, + = clockwise
});
function calibrate() { cfg.centre = rawRoll; save(); buzz(); }

function computeSteer() {
  let a = rawRoll - cfg.centre;
  if (cfg.inv) a = -a;
  const d = cfg.dead;
  a = Math.abs(a) < d ? 0 : Math.sign(a) * (Math.abs(a) - d);
  const target = Math.max(-1, Math.min(1, a / (cfg.range / 2 - d)));
  const k = 1 - cfg.smooth / 100;                         // lower k = smoother
  steer += (target - steer) * Math.max(0.05, k);
  return steer;
}

// ---- connection ----
let ws, lastSent = "";
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => setState("connected", "ok");
  ws.onclose = () => { setState("disconnected, retrying…", "bad"); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
}
function setState(t, c) { const s = $("state"); s.textContent = t; s.className = c || ""; }

setInterval(() => {
  const s = computeSteer();
  $("wheelg").setAttribute("transform", `rotate(${s * cfg.range / 2})`);
  $("deg").textContent = Math.round(s * cfg.range / 2) + "°" + (haveSensor ? "" : "  (no sensor)");
  if (!ws || ws.readyState !== 1) return;
  const msg = JSON.stringify({ s: +s.toFixed(3), t: +pedal.gas.toFixed(3), b: +pedal.brake.toFixed(3), btn: [...held] });
  if (msg !== lastSent || Math.random() < 0.05) { ws.send(msg); lastSent = msg; }  // occasional resend as keep-alive
}, 16);
connect();

// ---- misc UI ----
async function fullscreen() {
  try { await document.documentElement.requestFullscreen(); } catch {}
  try { await screen.orientation.lock("landscape"); } catch {}
  try { await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) fullscreen(); });
$("bFs").onclick = fullscreen;
$("bCal").onclick = calibrate; $("bCal2").onclick = calibrate;
$("bSet").onclick = () => $("settings").classList.add("open");
$("bClose").onclick = () => $("settings").classList.remove("open");

const bind = (id, key, vid, fmt) => {
  const el = $(id), v = vid && $(vid);
  const show = () => { if (v) v.textContent = fmt(cfg[key]); };
  if (el.type === "checkbox") { el.checked = cfg[key]; el.onchange = () => { cfg[key] = el.checked; save(); }; }
  else { el.value = cfg[key]; el.oninput = () => { cfg[key] = +el.value; save(); show(); }; }
  show();
};
bind("sRange", "range", "vRange", (x) => x + "°");
bind("sDead", "dead", "vDead", (x) => x + "°");
bind("sSmooth", "smooth", "vSmooth", (x) => x + "%");
bind("sInv", "inv"); bind("sAnalog", "analog");
</script>
</body>
</html>

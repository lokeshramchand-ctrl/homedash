# ---------------------------------------------------------------- Data manager (browse and query databases)
data:
  enabled: false                              # true turns on the Data page (installs the database drivers)
  # sqlite_dirs: [/srv/databases]             # SQLite files may only be opened under these directories
  # allowed_nets: [192.168.1.0/24]            # where connections created in the UI may point
  connections: []                             # declared here = read-only by default, locked in the UI
  #  - id: main_mongo                         # letters, digits, underscore
  #    kind: mongodb                          # mongodb | redis | postgres | mysql | mssql | sqlite | milvus
  #    name: Main Mongo
  #    uri: mongodb://user:${MONGO_PASSWORD}@192.168.1.40:27017/
  #  - id: cache
  #    kind: redis
  #    host: 192.168.1.41
  #    password: ${REDIS_PASSWORD}
  #    tls: true
  #  - id: reports
  #    kind: postgres
  #    host: 192.168.1.42
  #    username: dashboard_ro
  #    password: ${PG_PASSWORD}
  #    database: reports

# ---------------------------------------------------------------- nginx
nginx:
  manage: true                                # Nginx page can create/edit/delete sites inside this container
  # sites_dir: /etc/nginx/sites-enabled       # where vhosts live: the Nginx page reads/writes here and apply renders here
  # conf_dir: /etc/nginx/conf.d               # http-level snippets (default-deny, JSON log format)
  # binary: nginx                             # command used for `nginx -t` and reload
  # default_deny: false                       # refuse TLS for hostnames that have no site
  # internal_networks: [100.64.0.0/10]        # extra ranges treated as "internal" (VPN, mesh)
  # homedash:                                 # put homedash itself behind nginx
  #   domain: dash.example.com
  #   tls_cert: /etc/letsencrypt/live/example.com/fullchain.pem
  #   tls_key: /etc/letsencrypt/live/example.com/privkey.pem
  #   redirect_http: true
  #   allow: [192.168.1.0/24]                 # optional allow-list
  # sites:                                    # reverse proxies for your other services
  #   - name: jellyfin
  #     domain: jellyfin.example.com
  #     upstream: http://192.168.1.50:8096
  #     tls_cert: /etc/letsencrypt/live/example.com/fullchain.pem
  #     tls_key: /etc/letsencrypt/live/example.com/privkey.pem
  #     websocket: true
  #     internal_only: false
  #     max_body: 1m

metrics:
  enabled: true                               # GET /metrics for Prometheus (bearer token is generated)

# ---------------------------------------------------------------- add-ons: files for infrastructure around homedash
# `homedash-config apply` renders these into /etc/homedash/rendered/ . Host files are installed with
# tools/pve/host-addons.sh on the Proxmox host; stack files go to your Loki / Prometheus / Grafana containers.
addons:
  alloy:                                      # one log shipper on the Proxmox host -> Loki
    enabled: false
    # loki_push_url: http://192.168.1.16:3100/loki/api/v1/push   # default: loki.url + /loki/api/v1/push
    # host_label: pve
    # environment: homelab
    # timezone: UTC                           # time zone of nginx error log timestamps
    # nginx_logs: true                        # also writes an nginx JSON access log
    # guests: true                            # ship every LXC guest's journal
    # app_logs:
    #   - { name: myapp, path: /var/log/myapp/*.log }
  loki_server:                                # config for your Loki container
    enabled: false
    # retention_days: 31
    # nginx_retention_days: 14
  prometheus:                                 # config for your Prometheus container + node exporter on the host
    enabled: false
    # scrape_interval: 15s
    # homedash_target: 192.168.1.60:3000      # how Prometheus reaches this container
    # node_exporter_listen: 192.168.1.10:9100
    # node_targets: [ { name: pve, address: "192.168.1.10:9100" } ]
    # crowdsec_targets: [ { name: crowdsec, address: "192.168.1.70:6060" } ]
    # targets:
    #   - { job: speedtest, targets: ["192.168.1.80:80"], path: /prometheus, interval: 60s }
  crowdsec:                                   # snapshot timer on the host feeding the CrowdSec page
    enabled: false
    # container: 0                            # CTID of the central CrowdSec engine; 0 = cscli on the host
    # interval_seconds: 30
  grafana:
    provision: false                          # datasource + dashboard provisioning files

# Any variable the settings above do not cover can be set verbatim (see server/.env.example):
# env:
#   LOG_LEVEL: debug

# Service tiles: read-only status cards for the other things in your lab (Services page).
# kinds: docker, portainer, pihole, npm, jellyfin, homeassistant, http
# A tile that is unreachable for two checks in a row raises one "services" alert, and one when it recovers.
# tiles:
#   - kind: docker                      # Docker Engine API, ideally through a read-only socket proxy
#     name: Docker
#     url: http://192.0.2.10:2375
#   - kind: pihole                      # v6: password (an app password works); v5: token
#     url: http://192.0.2.2
#     password: ${PIHOLE_PASSWORD}
#     public_url: http://pihole.lan/admin
#   - kind: portainer
#     url: https://192.0.2.10:9443
#     token: ${PORTAINER_TOKEN}
#     insecure_tls: true
#   - kind: npm                         # Nginx Proxy Manager: proxy host counts and certificate expiry
#     url: http://192.0.2.11:81
#     username: ${NPM_EMAIL}
#     password: ${NPM_PASSWORD}
#   - kind: jellyfin                    # token (API key) is optional; adds streams and library counts
#     url: http://192.0.2.12:8096
#     token: ${JELLYFIN_KEY}
#   - kind: homeassistant               # long-lived access token
#     url: http://192.0.2.13:8123
#     token: ${HA_TOKEN}
#   - kind: http                        # anything that answers JSON; pick the numbers to show
#     name: Router
#     url: http://192.0.2.1
#     path: /status
#     stats: [ { label: Clients, path: data.clients } ]

# Audit trail: every action row is hash-chained (tamper-evident). GET /api/admin/audit/verify checks the chain,
# GET /api/admin/audit/export?after=<id>&format=json|cef downloads it. These push each new row to a collector as it happens.
# audit:
#   syslog: udp://192.0.2.50:514       # or tcp://host:514 (RFC 5424, facility authpriv)
#   format: cef                        # json (default) or cef
#   webhook_url: https://siem.example/ingest
#   webhook_secret: ${AUDIT_WEBHOOK_SECRET}   # adds X-Homedash-Signature: sha256=<hmac of the body>

# Config as code: scenes, schedules, alert routes and maintenance windows kept in this file.
# Items declared here are created, updated and removed to match the file every time the server starts, and are
# read-only in the UI. Things you create in the UI are never touched (a name clash is skipped with a warning).
# policy:
#   scenes:
#     - name: Movie night
#       steps:
#         - { vmid: 101, action: stop }
#         - { vmid: 105, action: start, wait_seconds: 30 }
#   schedules:
#     - { name: Nightly shutdown, scene: Movie night, days: weekdays, time: "23:30" }
#     - { name: Weekend start, vmid: 101, action: start, days: [sat, sun], time: "08:00" }
#   alert_routes:
#     - { name: Page me, min_level: error, categories: [host, guest], channels: [pagerduty] }
#   maintenance:
#     - name: Weekly patching
#       weekly: { days: [sun], start: "22:00", minutes: 120 }
#       categories: [tasks, guest]

# Public status page at /status and /status.json (no sign-in). Shows only what you list, as operational / degraded /
# outage: no addresses, errors or numbers. Expose only /status* through your reverse proxy if it faces the internet.
# status_page:
#   enabled: true
#   title: Home lab status
#   message: Planned maintenance is announced here.
#   tiles: [pihole, jellyfin]        # tile ids, or "*" for all
#   monitors: ["Website"]            # Uptime Kuma monitor names, or "*"
#
# Proxmox Backup Server tile (a read-only API token with Datastore.Audit and Sys.Audit):
#   - kind: pbs
#     url: https://192.0.2.20:8007
#     token: ${PBS_TOKEN}            # user@pbs!tokenname:secret
#     insecure_tls: true

# homedash.yaml: the one file that switches homedash features on.
#
# Edit this file, then run:   homedash-config validate && homedash-config apply --restart
# `validate` lists which integrations your settings turn on. Anything you leave out stays off.
#
# Secrets: write ${NAME} here and put NAME=value in /etc/homedash/secrets.env (mode 600), so this file can be
# shared or committed. Plain values work too.  Reference: https://github.com/lokeshramchand-ctrl/homedash#configuration

server:
  port: 3000
  # https: true            # behind an HTTPS reverse proxy: secure cookies, trust the local proxy
  # secure_cookies: false  # explicit override of the cookie flag
  # trust_proxy: false     # or a list of proxy IPs allowed to set X-Forwarded-For
  # session_hours: 12
  # session_idle_minutes: 120
  # host_journal: false    # let the Logs page read the host journal (needs the systemd-journal group)
  # log_retention_days: 90
  # frame_src: []          # extra origins the UI may embed, e.g. a Kuma status page

# ---------------------------------------------------------------- Proxmox (guests, node, health, backups)
proxmox:
  url: https://192.168.1.10:8006
  node: pve
  token_id: homedash@pve!ui          # create with tools/pve/create-token.sh
  token_secret: ${PVE_TOKEN_SECRET}
  insecure_tls: true                 # self-signed Proxmox certificate
  # url: [https://pve1:8006, https://pve2:8006]   # members of one cluster: if the first is down the next answers
  # allowed_vmids: []                # empty = every guest on the node
  # protected_vmids: [100]           # guests homedash may never act on
  # featured_vmid: 0                 # guest shown as a large card
  # conflicts: { "100": [101] }      # starting 100 warns when 101 is running (GPU passthrough)
  # allow_host_power: false          # kill switch for the whole node
  # backup_max_age_days: 8
  # snapshot_max_age_days: 30
  # memory_reserve_mb: 1024

# Several clusters or stand-alone nodes behind one dashboard: replace url/node/token_* above with a list. Each entry has its
# own token, protected guests and settings; use the cluster switcher in the top bar. Several addresses per cluster = failover.
# proxmox:
#   clusters:
#     - id: lab
#       name: Lab cluster
#       url: [https://pve1.lab:8006, https://pve2.lab:8006, https://pve3.lab:8006]
#       node: pve1                     # the node host pages (Node, Health, Capacity) open on
#       token_id: homedash@pve!ui
#       token_secret: ${LAB_TOKEN}
#       insecure_tls: true
#       protected_vmids: [100]
#       allow_host_power: false
#     - id: office
#       name: Office
#       url: https://pve.office:8006
#       node: pve
#       token_id: homedash@pve!ui
#       token_secret: ${OFFICE_TOKEN}

# ---------------------------------------------------------------- sign-in
auth:
  mfa:
    enabled: false                   # TOTP two-step sign-in (key is generated for you)
    # required: false                # force everyone to enrol before anything else loads
    # issuer: homedash
  oidc:                              # any OpenID Connect provider: Keycloak, Authentik, Authelia, Zitadel, Entra ID, Google, Okta...
    # issuer: https://sso.example.com/realms/home
    # client_id: homedash
    # client_secret: ${OIDC_CLIENT_SECRET}
    # redirect_uri: https://dash.example.com/api/auth/sso/callback
    # scopes: [openid, profile, email]
    # allowed_users: [alice, bob@example.com]   # SSO stays OFF unless this or required_role is set
    # required_role: homedash                   # role or group claim the user must carry
    # roles_claim: [realm_access.roles, groups] # where roles live in the ID token
    # admin_users: [alice]                      # these users get admin
    # default_role: viewer                      # everyone else: viewer | operator | admin
    # label: Sign in with SSO
  # passkeys:                          # sign in with a fingerprint, face, PIN or security key (needs HTTPS)
  #   rp_id: dash.example.com          # the domain people type
  #   origin: https://dash.example.com
  #   rp_name: homedash

# ---------------------------------------------------------------- who may do what
# access:
#   teams:                             # a team limits its members to certain guests; no team = the role applies everywhere
#     web:
#       vmids: ["100-120", 205]        # ids and ranges
#       tags: [lab]                    # and/or Proxmox tags
#       # cluster: lab                 # with several clusters: the ids belong to this cluster only (guest ids repeat across clusters)
#     db:
#       vmids: ["150-159"]
#   group_roles:                       # identity-provider groups (OIDC claims or SCIM) -> role. Highest match wins.
#     admin: [homedash-admins]
#     operator: [ops]
#     viewer: [staff]
#   group_teams:                       # group -> team(s)
#     web-team: [web]
#     db-team: [db]
#   approvals:                         # four-eyes: these actions need a second administrator
#     actions: [host.shutdown, snapshot.rollback, nginx.delete]   # or ["*"]; see the list on the Access page
#     ttl_minutes: 30
#     allow_self: false                # true lets one admin approve their own request (single-admin labs)
#   token_default_days: 90
#   token_max_days: 365
# scim:                                # lets Okta / Entra ID / Authentik provision people: base URL <dashboard>/scim/v2
#   token: ${SCIM_TOKEN}               # 24+ characters: openssl rand -hex 24

# ---------------------------------------------------------------- monitoring integrations
# grafana:
#   url: http://192.168.1.14:3000
#   public_url: https://grafana.example.com   # what the browser opens (defaults to url)
#   token: ${GRAFANA_TOKEN}                   # read-only service account; Grafana needs allow_embedding = true
#   datasource_uid: prometheus
# prometheus:
#   url: http://192.168.1.14:9090             # CrowdSec history and engine counters
# kuma:
#   url: http://192.168.1.15:3001
#   api_key: ${KUMA_API_KEY}
# loki:                                       # turns on Logs > Analytics and Loki
#   url: http://192.168.1.16:3100
#   public_url: ""
# crowdsec:                                   # turns on the CrowdSec page (feed it with addons.crowdsec)
#   snapshot: /var/lib/homedash/crowdsec/state.json
#   central_name: crowdsec                    # Prometheus instance_name of the central engine
#   host_name: pve-host                       # machine name of the Proxmox host's own engine
# ---------------------------------------------------------------- alert channels (use any number of them)
# Alerts go to every channel below that is set up. Pick which alerts each one gets on the Notifications page.
# ntfy:
#   url: http://192.168.1.20
#   topic: homedash-8f3a9c                    # keep it unguessable
#   token: ${NTFY_TOKEN}
#   alert_cpu: 0.9                            # resource thresholds apply to all channels
# gotify:
#   url: http://192.168.1.21
#   token: ${GOTIFY_TOKEN}                    # an application token
# discord:
#   webhook_url: ${DISCORD_WEBHOOK}           # https://discord.com/api/webhooks/...
#   username: homedash
# slack:
#   webhook_url: ${SLACK_WEBHOOK}             # https://hooks.slack.com/services/...
# telegram:
#   bot_token: ${TELEGRAM_TOKEN}              # from @BotFather
#   chat_id: "-1001234567890"
# email:                                      # warnings and errors only by default (changeable per channel in the UI)
#   host: smtp.example.com
#   port: 587                                 # 465 with secure: true
#   starttls: true
#   user: alerts@example.com
#   password: ${SMTP_PASSWORD}
#   from: homedash@example.com
#   to: [me@example.com, ops@example.com]
# apprise:                                    # an Apprise API server fans out to ~80 services
#   url: http://192.168.1.22:8000
#   key: homedash                             # a saved Apprise configuration key ...
#   # urls: ["pover://user@token"]            # ... or stateless: the service URLs to notify
#   # tag: homelab
# pagerduty:                                  # opens an incident per problem and closes it when it recovers
#   routing_key: ${PAGERDUTY_KEY}             # Events API v2 integration key (32 characters)
# opsgenie:
#   api_key: ${OPSGENIE_KEY}
#   region: us                                # us | eu
# Incident tools page for errors only by default (change it per channel on the Notifications page), and always
# receive recoveries so an incident never stays open. Maintenance windows and routing rules are on that page too.
# webhook:                                    # anything else: POSTs JSON {source, title, message, level, category, ...}
#   url: https://example.com/hooks/homedash
#   secret: ${WEBHOOK_SECRET}                 # sent as a Bearer token
# ai:                                         # Ask AI on log lines; any OpenAI-compatible endpoint
#   base_url: http://192.168.1.30:11434/v1    # e.g. Ollama
#   model: llama3.1
#   api_key: ""


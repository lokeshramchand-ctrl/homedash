name: Feature request
description: An idea that would make homedash more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first; the solution can follow
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen
  - type: textarea
    id: alt
    attributes:
      label: What do you do today instead
